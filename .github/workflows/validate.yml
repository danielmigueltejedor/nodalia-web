name: Validate and deploy Nodalia sites

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Rebuild so the static pages carry the latest releases of every app. The pages also ask
  # GitHub in the browser, so a new release shows at once; this keeps the HTML itself current.
  schedule:
    - cron: '17 */3 * * *'
  # An app's release workflow can trigger it straight away (event type: app-released).
  repository_dispatch:
    types: [app-released]

permissions:
  contents: read

concurrency:
  group: nodalia-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build and test all five sites
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm test
      - name: Package validated static sites
        uses: actions/upload-artifact@v4
        with:
          name: nodalia-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Publish five Cloudflare Pages projects
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nodalia-dist
          path: dist/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error title=Cloudflare no configurado::Define CLOUDFLARE_API_TOKEN en Settings > Secrets and variables > Actions > Secrets y CLOUDFLARE_ACCOUNT_ID en Secrets o Variables de este repositorio."
            exit 1
          fi
      - name: Deploy all sites to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for site in portal vortia vinilo lienzo nodalix; do
            test -f "dist/$site/index.html"
            echo "::group::Deploy nodalia-$site"
            npx --yes wrangler@4.158.0 pages deploy "dist/$site" \
              --project-name="nodalia-$site" \
              --branch=main \
              --commit-hash="$GITHUB_SHA"
            echo "::endgroup::"
          done
